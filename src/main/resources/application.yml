# 공통 설정. 환경마다 달라지는 값은 환경변수로 덮어쓴다 (${이름:기본값}).
# 기본값은 로컬 개발(compose.yaml) 기준이다.

spring:
  application:
    name: ticketrush

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketrush}
    username: ${DB_USERNAME:ticketrush}
    password: ${DB_PASSWORD:ticketrush-local}

  jpa:
    hibernate:
      # 스키마는 Flyway만 바꾼다. 엔티티와 스키마가 다르면 시작하지 않는다 (ADR-0002)
      ddl-auto: validate
    # 컨트롤러까지 DB 커넥션을 붙잡지 않게 한다. 부하 상황에서 커넥션 고갈을 막는 실무 기본값
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        # ?size=100000 같은 요청으로 한 번에 대량 조회하는 것을 막는다
        max-page-size: 100

ticketrush:
  jwt:
    # 기본값은 로컬 개발 전용. 운영에서는 반드시 환경변수 JWT_SECRET(32바이트 이상)으로 덮어쓴다
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-32bytes!!}
    access-token-ttl: 1h
  hold:
    # 좌석 선점 유지 시간 (F4)
    duration: 5m
    # 만료된 선점을 정리하는 주기(밀리초, F6). 정리 전에도 만료된 좌석은 조회·선점 시 AVAILABLE로 취급한다
    cleanup-interval-ms: 30000
    # 좌석 상태를 바꿀 때의 잠금 방식 (ADR-0007)
    #   pessimistic: SELECT ... FOR UPDATE (운영 기본값)
    #   none: 잠금 없음. 부하 테스트에서 기준선을 재현할 때만 쓴다. 동시 선점이 덮어써질 수 있다
    locking: ${HOLD_LOCKING:pessimistic}

server:
  # 종료 신호를 받으면 처리 중인 요청을 끝낸 뒤 내려간다 (배포 중 요청 유실 방지)
  shutdown: graceful

management:
  info:
    env:
      # 아래 info.* 값을 /actuator/info로 내보낸다. 부하 테스트가 어떤 설정으로 실행됐는지 기록하는 데 쓴다
      enabled: true
  endpoints:
    web:
      exposure:
        # prometheus: 지표 수집용. 운영에서는 로드밸런서에 노출하지 않고 내부망에서만 수집한다
        include: health, info, prometheus
  endpoint:
    health:
      # /actuator/health/liveness, /readiness 를 연다 (컨테이너 헬스체크용)
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 응답시간 히스토그램을 내보내야 Prometheus에서 p95·p99를 계산할 수 있다 (SLO 측정)
      percentiles-histogram:
        http.server.requests: true

# /actuator/info에 노출할 실행 설정. 비밀값은 넣지 않는다
info:
  ticketrush:
    hold-locking: ${ticketrush.hold.locking}
